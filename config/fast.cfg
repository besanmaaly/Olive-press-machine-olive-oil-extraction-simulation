# config/fast.cfg -- fast test run: time_scale 10, no GUI, 2 batches (copy of default.cfg with 3 changes)
# Syntax:  key = value            scalar
#          key = min max          range (two numbers; a single number means min = max)
#          key.stage = ...        per-stage key; stage in {reception, cleaning, washing,
#                                 crushing, malaxation, pressing}
#          '#' starts a comment; blank lines are ignored; keys are case-sensitive.
# Times marked "simulated" are divided by time_scale before sleeping.

# ---- general
seed = 42
time_scale = 10

# ---- reception / conveyor belt
num_batches = 2
batch_mass_kg = 200 500
batch_interval_ms = 1500 3000
container_capacity_kg = 500
conveyor_chunk_kg = 50
conveyor_tick_ms = 200
initial_debris_pct = 2 8
initial_impurity_pct = 3 10

# ---- process physics
cleaning_removal_pct = 85 98
washing_removal_pct = 90 99
paste_particle_mm = 1.0 5.0
droplet_final_um = 30 60
oil_yield_pct = 12 18
water_pct = 35 45
press_method = 0

# ---- per-stage processing time (simulated ms)
proc_time_ms.reception = 0 0
proc_time_ms.cleaning = 400 800
proc_time_ms.washing = 500 900
proc_time_ms.crushing = 400 700
proc_time_ms.malaxation = 800 1200
proc_time_ms.pressing = 600 1000

# ---- per-stage sensor nominal ranges (what the simulated sensors normally read)
temp_nominal_c.reception = 18 28
temp_nominal_c.cleaning = 18 30
temp_nominal_c.washing = 18 30
temp_nominal_c.crushing = 20 30
temp_nominal_c.malaxation = 24 28
temp_nominal_c.pressing = 22 30
pressure_nominal_bar.reception = 1.0 1.1
pressure_nominal_bar.cleaning = 1.0 1.2
pressure_nominal_bar.washing = 1.0 1.5
pressure_nominal_bar.crushing = 1.0 1.3
pressure_nominal_bar.malaxation = 1.0 1.2
pressure_nominal_bar.pressing = 40 60

# ---- per-stage safe operating limits (checked by Quality Control)
temp_limit_c.reception = 5 35
temp_limit_c.cleaning = 5 38
temp_limit_c.washing = 5 38
temp_limit_c.crushing = 10 35
temp_limit_c.malaxation = 18 30
temp_limit_c.pressing = 15 35
pressure_limit_bar.reception = 0.8 1.5
pressure_limit_bar.cleaning = 0.8 1.6
pressure_limit_bar.washing = 0.8 2.5
pressure_limit_bar.crushing = 0.8 2.0
pressure_limit_bar.malaxation = 0.8 1.6
pressure_limit_bar.pressing = 30 70
max_proc_time_ms.reception = 2000
max_proc_time_ms.cleaning = 2000
max_proc_time_ms.washing = 2000
max_proc_time_ms.crushing = 2000
max_proc_time_ms.malaxation = 3000
max_proc_time_ms.pressing = 2000

# ---- sensors / quality control
fault_prob_pct = 1.0
warn_margin_pct = 10
qc_report_interval_ms = 2000

# ---- OpenMP
use_openmp = 1
omp_threads = 4
sim_elements_per_lot = 500000

# ---- supervisor
critical_pause_ms = 2000
max_critical_events = 10
drain_timeout_ms = 3000
log_file = olive_press.log

# ---- GUI
enable_gui = 0
gui_auto_close_ms = 5000
window_w = 1100
window_h = 700
